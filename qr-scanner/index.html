<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QR & Barcode Scanner</title>

    <!-- Alpine.js for reactivity -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <!-- html5-qrcode for scanning -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #3b82f6;
            --primary-dark: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-600: #4b5563;
            --gray-800: #1f2937;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--gray-100);
            min-height: 100vh;
            color: var(--gray-800);
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 1rem;
        }

        header {
            text-align: center;
            padding: 1rem 0;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--gray-800);
        }

        /* Scanner Section */
        .scanner-section {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1rem;
        }

        #reader {
            width: 100%;
        }

        #reader video {
            width: 100% !important;
            border-radius: 12px 12px 0 0;
        }

        /* Override html5-qrcode styles */
        #reader__scan_region {
            min-height: 250px;
        }

        #reader__dashboard {
            padding: 1rem !important;
        }

        #reader__dashboard_section_csr button {
            background: var(--primary) !important;
            border: none !important;
            padding: 0.75rem 1.5rem !important;
            border-radius: 8px !important;
            color: white !important;
            font-size: 1rem !important;
            cursor: pointer !important;
        }

        #reader__dashboard_section_csr button:hover {
            background: var(--primary-dark) !important;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 0.5rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn {
            flex: 1;
            padding: 0.875rem 1rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-secondary {
            background: var(--gray-200);
            color: var(--gray-800);
        }

        .btn-secondary:hover {
            background: var(--gray-300);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Toast Notification */
        .toast-container {
            position: fixed;
            top: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: calc(100% - 2rem);
            max-width: 400px;
        }

        .toast {
            background: var(--success);
            color: white;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            animation: slideIn 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .toast.duplicate {
            background: var(--warning);
        }

        .toast-icon {
            font-size: 1.5rem;
        }

        .toast-content {
            flex: 1;
            overflow: hidden;
        }

        .toast-title {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .toast-message {
            font-size: 0.8rem;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Results List */
        .results-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
        }

        .results-header h2 {
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .count-badge {
            background: var(--primary);
            color: white;
            padding: 0.125rem 0.5rem;
            border-radius: 999px;
            font-size: 0.75rem;
        }

        .clear-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 0.875rem;
            cursor: pointer;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }

        .clear-btn:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .results-list {
            /* No max-height - let list grow naturally */
        }

        .result-item {
            padding: 1rem;
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-icon {
            width: 40px;
            height: 40px;
            background: var(--gray-100);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.25rem;
        }

        .result-content {
            flex: 1;
            min-width: 0;
        }

        .result-type {
            font-size: 0.75rem;
            color: var(--gray-600);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.25rem;
        }

        .result-value {
            word-break: break-all;
            font-size: 0.9rem;
        }

        .result-value a {
            color: var(--primary);
            text-decoration: none;
        }

        .result-value a:hover {
            text-decoration: underline;
        }

        .result-meta {
            font-size: 0.75rem;
            color: var(--gray-600);
            margin-top: 0.25rem;
            display: flex;
            gap: 0.5rem;
        }

        .scan-count {
            background: var(--warning);
            color: white;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            font-size: 0.7rem;
        }

        .result-actions {
            display: flex;
            gap: 0.25rem;
        }

        .action-btn {
            background: none;
            border: none;
            padding: 0.5rem;
            cursor: pointer;
            border-radius: 4px;
            color: var(--gray-600);
            font-size: 1rem;
        }

        .action-btn:hover {
            background: var(--gray-100);
            color: var(--gray-800);
        }

        .action-btn.delete:hover {
            background: rgba(239, 68, 68, 0.1);
            color: var(--danger);
        }

        /* Empty State */
        .empty-state {
            padding: 3rem 1rem;
            text-align: center;
            color: var(--gray-600);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        /* Status indicator */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.5rem;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gray-300);
        }

        .status-dot.active {
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Copy feedback */
        .copied-feedback {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--gray-800);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-size: 0.875rem;
            animation: fadeInOut 2s ease;
            z-index: 1000;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px); }
            15% { opacity: 1; transform: translateX(-50%) translateY(0); }
            85% { opacity: 1; transform: translateX(-50%) translateY(0); }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        /* Debug section */
        .debug-section {
            margin-top: 2rem;
            padding: 1rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .debug-section h3 {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-bottom: 0.75rem;
        }

        .debug-buttons {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .debug-btn {
            padding: 0.5rem 1rem;
            border: 1px solid var(--gray-300);
            border-radius: 6px;
            background: white;
            font-size: 0.875rem;
            cursor: pointer;
        }

        .debug-btn:hover {
            background: var(--gray-100);
        }

        .debug-log {
            background: var(--gray-800);
            color: #10b981;
            padding: 0.75rem;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.75rem;
            max-height: 200px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body x-data="scanner()" x-init="init()">
    <div class="container">
        <header>
            <h1>📱 QR & Barcode Scanner</h1>
        </header>

        <!-- Toast Notifications -->
        <div class="toast-container">
            <template x-for="toast in toasts" :key="toast.id">
                <div class="toast" :class="{ 'duplicate': toast.isDuplicate }">
                    <span class="toast-icon" x-text="toast.isDuplicate ? '🔄' : '✅'"></span>
                    <div class="toast-content">
                        <div class="toast-title" x-text="toast.isDuplicate ? 'Already Scanned' : 'New Code Found!'"></div>
                        <div class="toast-message" x-text="toast.value"></div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Scanner -->
        <div class="scanner-section" x-show="!showListOnly">
            <div id="reader"></div>
            <div class="status-bar">
                <span class="status-dot" :class="{ 'active': isScanning }"></span>
                <span x-text="isScanning ? 'Scanning...' : 'Scanner ready'"></span>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <template x-if="!isScanning && !showListOnly">
                <button class="btn btn-primary" @click="startScanning()">
                    <span>📷</span> Start Scanning
                </button>
            </template>
            <template x-if="isScanning">
                <button class="btn btn-danger" @click="stopScanning()">
                    <span>⏹️</span> Stop Scanning
                </button>
            </template>
            <template x-if="showListOnly">
                <button class="btn btn-primary" @click="showListOnly = false; startScanning()">
                    <span>📷</span> Resume Scanning
                </button>
            </template>
            <button class="btn btn-secondary" @click="toggleListView()" :disabled="scannedCodes.length === 0">
                <span x-text="showListOnly ? '🔙' : '📋'"></span>
                <span x-text="showListOnly ? 'Back' : 'View List'"></span>
            </button>
        </div>

        <!-- Results List -->
        <div class="results-section">
            <div class="results-header">
                <h2>
                    Scanned Codes
                    <span class="count-badge" x-show="scannedCodes.length > 0" x-text="scannedCodes.length"></span>
                </h2>
                <button class="clear-btn" x-show="scannedCodes.length > 0" @click="clearAll()">
                    Clear All
                </button>
            </div>

            <div class="results-list">
                <template x-if="scannedCodes.length === 0">
                    <div class="empty-state">
                        <div class="empty-icon">📭</div>
                        <p>No codes scanned yet</p>
                        <p style="font-size: 0.8rem; margin-top: 0.5rem;">Point your camera at a QR code or barcode</p>
                    </div>
                </template>

                <template x-for="(item, index) in scannedCodes" :key="item.id">
                    <div class="result-item">
                        <div class="result-icon" x-text="getTypeIcon(item.type)"></div>
                        <div class="result-content">
                            <div class="result-type" x-text="item.format + ' • ' + item.type"></div>
                            <div class="result-value">
                                <template x-if="item.type === 'url'">
                                    <a :href="item.value" target="_blank" rel="noopener" x-text="item.value"></a>
                                </template>
                                <template x-if="item.type !== 'url'">
                                    <span x-text="item.value"></span>
                                </template>
                            </div>
                            <div class="result-meta">
                                <span x-text="formatTime(item.firstScanned)"></span>
                                <span class="scan-count" x-show="item.scanCount > 1" x-text="'×' + item.scanCount"></span>
                            </div>
                        </div>
                        <div class="result-actions">
                            <button class="action-btn" @click="copyToClipboard(item.value)" title="Copy">
                                📋
                            </button>
                            <button class="action-btn delete" @click="removeItem(index)" title="Delete">
                                🗑️
                            </button>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Copy Feedback -->
        <div class="copied-feedback" x-show="showCopied" x-transition>
            Copied to clipboard!
        </div>

        <!-- Debug Section -->
        <div class="debug-section">
            <h3>🔧 Audio Debug</h3>
            <div class="debug-buttons">
                <button class="debug-btn" @click="testSound('new')">🔊 Test New Beep</button>
                <button class="debug-btn" @click="testSound('duplicate')">🔊 Test Duplicate Beep</button>
                <button class="debug-btn" @click="debugAudioStatus()">📊 Check Status</button>
                <button class="debug-btn" @click="debugLog = ''">🗑️ Clear Log</button>
            </div>
            <div class="debug-log" x-text="debugLog || 'Debug output will appear here...'"></div>
        </div>
    </div>

    <script>
        function scanner() {
            return {
                html5QrcodeScanner: null,
                isScanning: false,
                showListOnly: false,
                scannedCodes: [],
                toasts: [],
                showCopied: false,
                audioContext: null,
                lastScan: { value: null, time: 0 },
                debugLog: '',

                init() {
                    // Load saved codes from localStorage
                    const saved = localStorage.getItem('scannedCodes');
                    if (saved) {
                        this.scannedCodes = JSON.parse(saved);
                    }
                },

                // Initialize audio context - must be called from user interaction (button click)
                async initAudio() {
                    if (!this.audioContext) {
                        this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    }
                    // Resume audio context (required for iOS Safari)
                    if (this.audioContext.state === 'suspended') {
                        await this.audioContext.resume();
                    }
                    // Play a silent sound to fully unlock audio on iOS
                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();
                    gainNode.gain.value = 0; // Silent
                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);
                    oscillator.start();
                    oscillator.stop(this.audioContext.currentTime + 0.01);
                },

                async startScanning() {
                    // Initialize audio on user interaction (required for iOS Safari)
                    await this.initAudio();

                    const config = {
                        fps: 10,
                        qrbox: { width: 250, height: 250 },
                        aspectRatio: 1.0,
                        showTorchButtonIfSupported: true,
                        showZoomSliderIfSupported: true,
                        defaultZoomValueIfSupported: 2
                    };

                    this.html5QrcodeScanner = new Html5Qrcode("reader");

                    this.html5QrcodeScanner.start(
                        { facingMode: "environment" },
                        config,
                        (decodedText, decodedResult) => {
                            this.onScanSuccess(decodedText, decodedResult);
                        },
                        (errorMessage) => {
                            // Ignore scan errors (no QR code in view)
                        }
                    ).then(() => {
                        this.isScanning = true;
                    }).catch((err) => {
                        console.error("Unable to start scanning", err);
                        alert("Unable to access camera. Please ensure you've granted camera permissions.");
                    });
                },

                async stopScanning() {
                    if (this.html5QrcodeScanner && this.isScanning) {
                        try {
                            await this.html5QrcodeScanner.stop();
                            this.isScanning = false;
                            this.html5QrcodeScanner.clear();
                        } catch (err) {
                            console.error("Error stopping scanner", err);
                            this.isScanning = false;
                        }
                    }
                },

                onScanSuccess(decodedText, decodedResult) {
                    const now = Date.now();
                    const format = decodedResult.result.format?.formatName || 'QR_CODE';
                    const type = this.detectType(decodedText);
                    const existingCode = this.scannedCodes.find(code => code.value === decodedText);
                    const isDuplicate = !!existingCode;

                    // Check if this is the same code scanned within 3 seconds - if so, ignore completely
                    if (this.lastScan.value === decodedText && (now - this.lastScan.time) < 3000) {
                        return; // Ignore rapid re-scan of same code
                    }

                    // Update last scan tracking
                    this.lastScan = { value: decodedText, time: now };

                    if (isDuplicate) {
                        // Update scan count for existing code
                        existingCode.scanCount++;
                        existingCode.lastScanned = new Date().toISOString();
                        this.playBeep(true);
                    } else {
                        // Add new code
                        this.scannedCodes.unshift({
                            id: Date.now(),
                            value: decodedText,
                            format: format,
                            type: type,
                            firstScanned: new Date().toISOString(),
                            lastScanned: new Date().toISOString(),
                            scanCount: 1
                        });
                        this.playBeep(false);
                    }

                    // Save to localStorage
                    this.saveToStorage();

                    // Show toast
                    this.showToast(decodedText, isDuplicate);
                },

                detectType(value) {
                    // URL detection
                    if (/^https?:\/\//i.test(value)) {
                        return 'url';
                    }
                    // Email detection
                    if (/^mailto:/i.test(value) || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
                        return 'email';
                    }
                    // Phone detection
                    if (/^tel:/i.test(value) || /^\+?[\d\s\-()]{10,}$/.test(value)) {
                        return 'phone';
                    }
                    // WiFi detection
                    if (/^WIFI:/i.test(value)) {
                        return 'wifi';
                    }
                    // vCard detection
                    if (/^BEGIN:VCARD/i.test(value)) {
                        return 'contact';
                    }
                    // Number detection
                    if (/^\d+$/.test(value)) {
                        return 'number';
                    }
                    // Default to text
                    return 'text';
                },

                getTypeIcon(type) {
                    const icons = {
                        'url': '🔗',
                        'email': '📧',
                        'phone': '📞',
                        'wifi': '📶',
                        'contact': '👤',
                        'number': '🔢',
                        'text': '📝'
                    };
                    return icons[type] || '📄';
                },

                async playBeep(isDuplicate) {
                    if (!this.audioContext) {
                        return; // Audio not initialized yet
                    }

                    // Ensure audio context is running (iOS may suspend it)
                    if (this.audioContext.state === 'suspended') {
                        try {
                            await this.audioContext.resume();
                        } catch (e) {
                            console.warn('Could not resume audio context:', e);
                            return;
                        }
                    }

                    const oscillator = this.audioContext.createOscillator();
                    const gainNode = this.audioContext.createGain();

                    oscillator.connect(gainNode);
                    gainNode.connect(this.audioContext.destination);

                    if (isDuplicate) {
                        // Double lower beep for duplicate
                        oscillator.frequency.value = 400;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.5;
                        oscillator.start();
                        oscillator.stop(this.audioContext.currentTime + 0.1);

                        // Second beep
                        setTimeout(() => {
                            if (this.audioContext && this.audioContext.state === 'running') {
                                const osc2 = this.audioContext.createOscillator();
                                const gain2 = this.audioContext.createGain();
                                osc2.connect(gain2);
                                gain2.connect(this.audioContext.destination);
                                osc2.frequency.value = 300;
                                osc2.type = 'sine';
                                gain2.gain.value = 0.5;
                                osc2.start();
                                osc2.stop(this.audioContext.currentTime + 0.1);
                            }
                        }, 120);
                    } else {
                        // Single higher beep for new code
                        oscillator.frequency.value = 800;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.5;
                        oscillator.start();
                        oscillator.stop(this.audioContext.currentTime + 0.15);
                    }
                },

                showToast(value, isDuplicate) {
                    const toast = {
                        id: Date.now(),
                        value: value,
                        isDuplicate: isDuplicate
                    };

                    this.toasts.push(toast);

                    // Remove toast after 2 seconds
                    setTimeout(() => {
                        this.toasts = this.toasts.filter(t => t.id !== toast.id);
                    }, 2000);
                },

                async toggleListView() {
                    if (this.isScanning) {
                        await this.stopScanning();
                    }
                    this.showListOnly = !this.showListOnly;
                },

                copyToClipboard(value) {
                    navigator.clipboard.writeText(value).then(() => {
                        this.showCopied = true;
                        setTimeout(() => {
                            this.showCopied = false;
                        }, 2000);
                    }).catch(err => {
                        console.error('Failed to copy:', err);
                    });
                },

                removeItem(index) {
                    this.scannedCodes.splice(index, 1);
                    this.saveToStorage();
                },

                async clearAll() {
                    // Stop scanning first to prevent camera freeze during confirm dialog
                    const wasScanning = this.isScanning;
                    if (wasScanning) {
                        await this.stopScanning();
                    }

                    if (confirm('Are you sure you want to clear all scanned codes?')) {
                        this.scannedCodes = [];
                        this.saveToStorage();
                    }

                    // Resume scanning if it was active
                    if (wasScanning) {
                        await this.startScanning();
                    }
                },

                saveToStorage() {
                    localStorage.setItem('scannedCodes', JSON.stringify(this.scannedCodes));
                },

                formatTime(isoString) {
                    const date = new Date(isoString);
                    return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                },

                // Debug methods
                log(msg) {
                    const time = new Date().toLocaleTimeString();
                    this.debugLog = `[${time}] ${msg}\n${this.debugLog}`;
                },

                async testSound(type) {
                    this.log(`Testing ${type} sound...`);

                    try {
                        // Initialize audio if needed (this is a user interaction)
                        await this.initAudio();
                        this.log(`AudioContext created/resumed`);
                        this.log(`State: ${this.audioContext.state}`);
                        this.log(`Sample rate: ${this.audioContext.sampleRate}`);

                        // Play the beep
                        await this.playBeep(type === 'duplicate');
                        this.log(`Sound played successfully!`);
                    } catch (e) {
                        this.log(`ERROR: ${e.message}`);
                    }
                },

                debugAudioStatus() {
                    this.log('--- Audio Status ---');
                    if (!this.audioContext) {
                        this.log('AudioContext: NOT CREATED');
                        this.log('Tip: Press "Test Sound" to initialize');
                    } else {
                        this.log(`AudioContext: EXISTS`);
                        this.log(`State: ${this.audioContext.state}`);
                        this.log(`Sample rate: ${this.audioContext.sampleRate}Hz`);
                        this.log(`Current time: ${this.audioContext.currentTime.toFixed(2)}s`);
                        this.log(`Base latency: ${(this.audioContext.baseLatency * 1000).toFixed(1)}ms`);
                    }
                    this.log(`User agent: ${navigator.userAgent.substring(0, 50)}...`);
                    this.log('-------------------');
                }
            };
        }
    </script>
</body>
